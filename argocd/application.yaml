apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: zerotouch
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/jay0237/zerotouch-app.git
    targetRevision: main
    path: helm/zerotouch

  destination:
    server: https://kubernetes.default.svc
    namespace: zerotouch

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true