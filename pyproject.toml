[project]
name = "zerotouch-app"
version = "0.1.0"
description = "ZeroTouch sample application"
authors = [
    {name = "Jay Joshi"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi>=0.139.2,<0.140.0",
    "uvicorn>=0.51.0,<0.52.0",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "prometheus-fastapi-instrumentator>=8.1.0,<9.0.0"
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "httpx>=0.28.1,<0.29.0",
    "ruff (>=0.16.0,<0.17.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"