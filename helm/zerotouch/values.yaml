replicaCount: 2

image:
  repository: zerotouch
  tag: latest
  pullPolicy: Never

service:
  type: ClusterIP
  port: 8000

config:
  APP_NAME: ZeroTouch
  APP_ENV: development
  LOG_LEVEL: INFO

secret:
  DATABASE_USER: admin
  DATABASE_PASSWORD: password123

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"

  limits:
    cpu: "500m"
    memory: "256Mi"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70