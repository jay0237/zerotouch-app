{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: zerotouch-ingress
  namespace: zerotouch

spec:
  ingressClassName: nginx

  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: zerotouch-service
                port:
                  number: {{ .Values.service.port }}
{{- end }}