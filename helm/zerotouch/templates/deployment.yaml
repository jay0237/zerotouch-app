apiVersion: apps/v1
kind: Deployment

metadata:
  name: zerotouch-app
  namespace: zerotouch

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: zerotouch

  template:
    metadata:
      labels:
        app: zerotouch
{{- with .Values.podAnnotations }}
      annotations:
{{ toYaml . | nindent 8 }}
{{- end }}

    spec:
      containers:
        - name: zerotouch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          envFrom:
            - configMapRef:
                name: zerotouch-config
            - secretRef:
                name: zerotouch-secret

          ports:
            - containerPort: 8000

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
{{ toYaml .Values.resources | nindent 12 }}