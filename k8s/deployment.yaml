apiVersion: apps/v1
kind: Deployment

metadata:
  name: zerotouch-app
  namespace: zerotouch

spec:
  replicas: 1

  selector:
    matchLabels:
      app: zerotouch

  template:
    metadata:
      labels:
        app: zerotouch
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"

    spec:
      containers:
        - name: zerotouch
          image: zerotouch:latest
          imagePullPolicy: Never

          envFrom:
            - configMapRef:
                name: zerotouch-config
            - secretRef:
                name: zerotouch-secret

          ports:
            - containerPort: 8000

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"

                limits:
                  cpu: "500m"
                  memory: "256Mi"